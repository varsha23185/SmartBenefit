server.port=8080

# ---- Set your MySQL password in the DB_PASSWORD environment variable (recommended),
# ---- or replace YOUR_MYSQL_PASSWORD below. Never commit a real password. ----
spring.datasource.url=jdbc:mysql://localhost:3306/smartbenefit?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:YOUR_MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
