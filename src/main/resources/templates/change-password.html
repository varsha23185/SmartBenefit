<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{password.title})}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container narrow">
    <div class="card">
        <h2 th:text="#{password.title}">Change Password</h2>
        <p class="msg" th:if="${changed}" th:text="#{password.changed}">Your password has been changed.</p>
        <p class="error-box" th:if="${error}" th:text="#{${error}}"></p>
        <form th:action="@{/account/password}" method="post">
            <label for="oldPassword" th:text="#{password.old}">Current password</label>
            <input id="oldPassword" name="oldPassword" type="password" required>
            <label for="newPassword" th:text="#{password.new}">New password</label>
            <input id="newPassword" name="newPassword" type="password" required minlength="8">
            <p class="muted" th:text="#{register.hint}"></p>
            <label for="confirmPassword" th:text="#{password.confirm}">Confirm new password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" required minlength="8">
            <button type="submit" th:text="#{password.submit}">Change password</button>
        </form>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
