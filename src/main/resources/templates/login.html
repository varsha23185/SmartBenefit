<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{login.title})}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container narrow">
    <div class="card">
        <h2 th:text="#{login.title}">Login</h2>
        <p class="error-box" th:if="${param.error}" th:text="#{login.error}"></p>
        <p class="msg" th:if="${param.registered}" th:text="#{login.registered}"></p>
        <p class="msg" th:if="${param.logout}" th:text="#{login.logout}"></p>
        <form th:action="@{/login}" method="post">
            <label for="email" th:text="#{login.email}">Email</label>
            <input id="email" name="email" type="email" required autofocus>
            <label for="password" th:text="#{login.password}">Password</label>
            <input id="password" name="password" type="password" required>
            <button type="submit" th:text="#{login.submit}">Login</button>
        </form>
        <p><a th:href="@{/register}" th:text="#{login.noaccount}">Register</a></p>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
