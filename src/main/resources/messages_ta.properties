# ---- home page and footer ----
home.title=வரவேற்பு
home.hero.title=நீங்கள் தகுதி பெறக்கூடிய அரசு திட்டங்களைக் கண்டறியுங்கள்
home.hero.sub=உங்கள் விவரங்களை ஒருமுறை உள்ளிடுங்கள். ஒவ்வொரு திட்டத்தையும் SmartBenefit சரிபார்த்து, ஒவ்வொரு முடிவையும் விளக்கி, உங்களுக்குச் சிறந்தவற்றை வரிசைப்படுத்தும்.
home.cta.start=இலவசக் கணக்கை உருவாக்குங்கள்
home.cta.login=உள்நுழை
home.f1.title=அனைத்துத் திட்டங்களையும் ஒரே நேரத்தில் சரிபார்க்கவும்
home.f1.text=ஒரே சுயவிவரம், அனைத்துத் திட்டங்கள். ஒவ்வொரு முடிவும் தகுதி உள்ளது, தகுதி இல்லை அல்லது கூடுதல் தகவல் தேவை என்று காட்டப்படும்.
home.f2.title=ஏன் என்பதை அறியுங்கள்
home.f2.text=ஒவ்வொரு நிபந்தனையும் பூர்த்தியானது, பூர்த்தியாகாதது அல்லது விடுபட்டது என்று காட்டப்படுவதால் முடிவை எளிதில் புரிந்துகொள்ளலாம்.
home.f3.title=உங்களுக்காக வரிசைப்படுத்தப்பட்டது
home.f3.text=தகுதியான திட்டங்கள் பலன், உங்கள் பொருத்தம் மற்றும் சுயவிவரத் தொடர்பு அடிப்படையில் வரிசைப்படுத்தப்படும்.
home.f4.title=என்ன-ஆனால் சோதனை
home.f4.text=வருமானம் போன்ற விவரங்களை மாற்றினால் எந்தத் திட்டங்கள் மாறும் என்பதை, சேமித்த சுயவிவரத்தை மாற்றாமல் பாருங்கள்.
home.how.title=எப்படிச் செயல்படுகிறது
home.step1=பதிவு செய்து உள்நுழையுங்கள்
home.step2=சுயவிவரத்தை நிரப்புங்கள் (தெரியாதவற்றைக் காலியாக விடலாம்)
home.step3=உங்கள் தகுதியைச் சரிபார்க்கவும்
home.step4=ஆவணங்கள், படிகள் மற்றும் அதிகாரப்பூர்வ இணையதள இணைப்பைப் பார்க்க ஒரு திட்டத்தைத் திறக்கவும்
home.note=SmartBenefit வழிகாட்டுதல் மட்டுமே வழங்குகிறது. விண்ணப்பங்கள் அதிகாரப்பூர்வ அரசு இணையதளங்களில் சமர்ப்பிக்கப்பட்டு, சரிபார்க்கப்பட்டு, அங்கீகரிக்கப்படுகின்றன.
footer.note=வழிகாட்டுதல் மட்டும் வழங்கும் கல்விசார் மாதிரித் திட்டம். விதிகளை எப்போதும் அதிகாரப்பூர்வ இணையதளத்தில் உறுதிசெய்யவும்.
